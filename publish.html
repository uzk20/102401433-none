<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布信息 - 校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <h1>发布信息</h1>
    <p class="subtitle">填写物品信息，发布校园失物招领</p>
  </header>

  <section class="form">
    <!-- 类型选择 -->
    <label class="form-label">类型 <span class="required">*</span></label>
    <div class="type-select">
      <button type="button" class="type-btn active" data-type="寻物">寻物</button>
      <button type="button" class="type-btn" data-type="招领">招领</button>
    </div>

    <!-- 物品名称 -->
    <label class="form-label">物品名称 <span class="required">*</span></label>
    <input id="name" type="text" placeholder="例如：黑色雨伞">

    <!-- 物品描述 -->
    <label class="form-label">物品描述</label>
    <textarea id="desc" rows="4" placeholder="描述颜色、品牌、特征等，方便同学辨认"></textarea>

    <!-- 地点 -->
    <label class="form-label">地点 <span class="required">*</span></label>
    <input id="place" type="text" placeholder="例如：图书馆三楼自习区">

    <!-- 时间 -->
    <label class="form-label">时间</label>
    <input id="time" type="text" placeholder="例如：今天 09:24">

    <!-- 联系方式 -->
    <label class="form-label">联系方式 <span class="required">*</span></label>
    <input id="contact" type="text" placeholder="手机号 / 微信号">

    <!-- 发布按钮 -->
    <button id="publishBtn" class="submit-btn">发布信息</button>
  </section>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">首页</a>
    <a href="publish.html" class="nav-item active">发布</a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/publish.js"></script>
</body>
</html>
