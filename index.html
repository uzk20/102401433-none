<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>校园失物招领 - 首页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部标题 -->
  <header class="header">
    <h1>校园失物招领</h1>
    <p class="subtitle">校园失物招领 · 互助平台</p>
  </header>

  <!-- 搜索区 -->
  <section class="search-bar">
    <input id="searchInput" type="text" placeholder="搜索物品名称">
    <button id="searchBtn">搜索</button>
  </section>

  <!-- 分类标签 -->
  <section class="filter-bar">
    <button class="filter-btn active" data-type="全部">全部</button>
    <button class="filter-btn" data-type="寻物">寻物</button>
    <button class="filter-btn" data-type="招领">招领</button>
  </section>

  <!-- 信息列表 -->
  <section id="list" class="list"></section>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">首页</a>
    <a href="publish.html" class="nav-item">发布</a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/index.js"></script>

</html>
